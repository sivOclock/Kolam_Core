<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolam Challenge</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <style>
      .chalk-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 36px;
        display: flex;
        align-items: flex-end;
        padding: 0 16px;
        gap: 4px;
        z-index: 100;
        pointer-events: none;
      }
      .chalk-nav a {
        pointer-events: all;
        font-family: 'Schoolbell', cursive;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-decoration: none;
        padding: 4px 18px 6px;
        border-radius: 6px 6px 0 0;
        border: 1px solid rgba(255,255,255,0.12);
        border-bottom: none;
        color: #9CA3AF;
        background: rgba(11,31,27,0.6);
        transition: color 0.15s, background 0.15s;
      }
      .chalk-nav a.active {
        color: #F9FAFB;
        background: #17332D;
        border-color: rgba(255,255,255,0.18);
      }
      .chalk-nav a:hover:not(.active) {
        color: #FACC15;
        background: rgba(23,51,45,0.8);
      }
      @media (max-width: 768px) {
        .chalk-nav {
          height: 42px;
          padding: 0 8px;
          gap: 2px;
        }
        .chalk-nav a {
          font-size: 0.85rem;
          padding: 6px 14px 8px;
          flex: 1;
          text-align: center;
        }
      }

      /* Mobile overlay */
      .mobile-block {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0B1F1B;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 24px 32px;
        text-align: center;
        font-family: 'Schoolbell', cursive;
        gap: 0;
      }
      .mobile-block canvas#kolam-logo {
        width: 220px;
        height: 220px;
        margin-bottom: 12px;
      }
      .mobile-block h1 {
        color: #F9FAFB;
        font-size: 1.6rem;
        font-weight: normal;
        margin: 0 0 12px;
        letter-spacing: 0.04em;
      }
      .mobile-block p {
        color: #9CA3AF;
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 0;
        max-width: 300px;
      }
      .mobile-block p span {
        color: #FACC15;
      }
      @media (max-width: 768px) {
        .mobile-block {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <!-- Mobile block -->
    <div class="mobile-block">
      <canvas id="kolam-logo" width="440" height="440"></canvas>
      <h1>Kolam Engine</h1>
      <p>Mobile version is still in development.<br/>Kindly use your <span>desktop</span> for the full experience.</p>
    </div>
    <script src="/kolam-logo.js"></script>

    <nav class="chalk-nav">
      <a href="./index.html">encoder</a>
      <a href="./challenge.html" class="active">challenge</a>
    </nav>
    <div id="app"></div>
    <script type="module" src="/src/challenge.ts"></script>
  </body>
</html>
